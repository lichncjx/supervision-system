version: '3.8'

services:
  db:
    image: postgres:16
    container_name: supervision-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: supervision
      POSTGRES_USER: supervision
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - supervision-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supervision -d supervision"]
      interval: 10s
      timeout: 5s
      retries: 12

  ops:
    image: supervision-system-ops:__OFFLINE_IMAGE_TAG__
    container_name: supervision-ops
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supervision-net

  app:
    image: supervision-system-app:__OFFLINE_IMAGE_TAG__
    container_name: supervision-app
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - supervision-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  supervision-net:
    name: supervision-net
    driver: bridge
