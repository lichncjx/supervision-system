name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image names and tags
        run: |
          IMAGE_NAME="${IMAGE_NAME,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "APP_TAGS=-t $IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "OPS_TAGS=-t ${IMAGE_NAME}-ops:${{ github.sha }}" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "PUSH_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "PUSH_LATEST=false" >> "$GITHUB_ENV"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build app and ops images
        run: |
          docker build --target app $APP_TAGS -t "$IMAGE_NAME:build" .
          docker build --target ops $OPS_TAGS -t "${IMAGE_NAME}-ops:build" .

      - name: Add release aliases
        if: env.RELEASE_TAG != ''
        run: |
          docker tag "$IMAGE_NAME:build" "$IMAGE_NAME:$RELEASE_TAG"
          docker tag "${IMAGE_NAME}-ops:build" "${IMAGE_NAME}-ops:$RELEASE_TAG"

      - name: Add latest aliases
        if: env.PUSH_LATEST == 'true'
        run: |
          docker tag "$IMAGE_NAME:build" "$IMAGE_NAME:latest"
          docker tag "${IMAGE_NAME}-ops:build" "${IMAGE_NAME}-ops:latest"

      - name: Push immutable commit images
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "${IMAGE_NAME}-ops:${{ github.sha }}"

      - name: Push release aliases
        if: env.RELEASE_TAG != ''
        run: |
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          docker push "${IMAGE_NAME}-ops:$RELEASE_TAG"

      - name: Push latest aliases
        if: env.PUSH_LATEST == 'true'
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "${IMAGE_NAME}-ops:latest"

      - name: Summary
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit tag: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: ${RELEASE_TAG:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App and ops images were built from the same commit." >> "$GITHUB_STEP_SUMMARY"
