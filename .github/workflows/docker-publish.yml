name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image names and source commit
        run: |
          IMAGE_NAME="${IMAGE_NAME,,}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build app and ops images
        if: github.ref_type == 'branch'
        run: |
          docker build --target app -t "$IMAGE_NAME:$SOURCE_SHA" -t "$IMAGE_NAME:latest" .
          docker build --target ops -t "${IMAGE_NAME}-ops:$SOURCE_SHA" -t "${IMAGE_NAME}-ops:latest" .

      - name: Pull immutable commit images for release
        if: github.ref_type == 'tag'
        run: |
          docker pull "$IMAGE_NAME:$SOURCE_SHA"
          docker pull "${IMAGE_NAME}-ops:$SOURCE_SHA"

      - name: Add release aliases
        if: github.ref_type == 'tag'
        run: |
          docker tag "$IMAGE_NAME:$SOURCE_SHA" "$IMAGE_NAME:$RELEASE_TAG"
          docker tag "${IMAGE_NAME}-ops:$SOURCE_SHA" "${IMAGE_NAME}-ops:$RELEASE_TAG"

      - name: Push immutable commit images
        if: github.ref_type == 'branch'
        run: |
          docker push "$IMAGE_NAME:$SOURCE_SHA"
          docker push "${IMAGE_NAME}-ops:$SOURCE_SHA"

      - name: Push release aliases
        if: github.ref_type == 'tag'
        run: |
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          docker push "${IMAGE_NAME}-ops:$RELEASE_TAG"

      - name: Push latest aliases
        if: github.ref_type == 'branch'
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "${IMAGE_NAME}-ops:latest"

      - name: Summary
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: ${RELEASE_TAG:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tags reuse the immutable app/ops commit images." >> "$GITHUB_STEP_SUMMARY"
